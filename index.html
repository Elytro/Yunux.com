<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>好孕妈妈交流群 - 温暖陪伴，科学孕育</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.3.4/css/bootstrap.min.css">
  <style>
    body {
      background: #fff;
      color: #555;
    }
    a, a:hover, a:focus {
      text-decoration: none;
    }
    .text-accent {
      color: #e0918b;
    }
    .hero {
      padding-top: 80px;
      padding-bottom: 60px;
    }
    .hero .glyphicon-heart {
      font-size: 36px;
      color: #f2c4c0;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: #666;
    }
    .hero .lead {
      font-size: 18px;
      line-height: 2;
      max-width: 560px;
      margin: 0 auto 40px;
      color: #999;
    }
    .btn-join {
      background: #e0918b;
      border-color: #e0918b;
      color: #fff;
      padding: 14px 52px;
      font-size: 18px;
      border-radius: 30px;
      letter-spacing: 2px;
      transition: all .3s ease;
    }
    .btn-join:hover,
    .btn-join:focus {
      background: #d47e78;
      border-color: #d47e78;
      color: #fff;
    }
    .feature-icon {
      font-size: 40px;
      color: #f2c4c0;
      margin-bottom: 18px;
    }
    .feature h3 {
      font-size: 18px;
      font-weight: 400;
      color: #888;
      margin-bottom: 12px;
    }
    .feature p {
      color: #aaa;
      line-height: 1.8;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: #f2c4c0;
      margin: 0 auto 16px;
    }
    .footer {
      margin-top: 60px;
      padding: 30px 0;
      color: #ccc;
      font-size: 13px;
    }
    @media (max-width: 767px) {
      .hero {
        padding-top: 50px;
        padding-bottom: 40px;
      }
      .hero h1 {
        font-size: 30px;
      }
      .hero .lead {
        font-size: 15px;
      }
      .btn-join {
        padding: 12px 40px;
        font-size: 16px;
      }
      .feature {
        margin-bottom: 36px;
      }
    }
  </style>
  <!--[if lt IE 9]>
    <script src="https://cdn.bootcdn.net/ajax/libs/html5shiv/3.7.2/html5shiv.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/respond.js/1.4.2/respond.min.js"></script>
  <![endif]-->
</head>
<body>

  <!-- Hero 区域 -->
  <div class="hero text-center">
    <div class="container">
      <span class="glyphicon glyphicon-heart" aria-hidden="true"></span>
      <h1>好孕妈妈<span class="text-accent">交流群</span></h1>
      <div class="divider"></div>
      <p class="lead">
        这里是一群温柔而坚定的妈妈。<br>
        从备孕到育儿，分享经验、彼此倾听、共同成长。<br>
        你不再是一个人——让爱与知识，陪你度过这段最美的时光。
      </p>
      <a href="#" class="btn btn-join btn-lg" role="button">
        <span class="glyphicon glyphicon-heart-empty" style="margin-right:6px;"></span>立即加入
      </a>
    </div>
  </div>

  <!-- 特色区域 -->
  <div class="container">
    <div class="row text-center">

      <div class="col-xs-12 col-sm-4 feature">
        <span class="glyphicon glyphicon-comment feature-icon" aria-hidden="true"></span>
        <h3>温暖交流</h3>
        <p>
          孕产期不再焦虑，姐妹们<br>
          随时分享心情与经验。
        </p>
      </div>

      <div class="col-xs-12 col-sm-4 feature">
        <span class="glyphicon glyphicon-education feature-icon" aria-hidden="true"></span>
        <h3>科学孕育</h3>
        <p>
          定期分享孕期营养、产后恢复<br>
          等专业靠谱干货。
        </p>
      </div>

      <div class="col-xs-12 col-sm-4 feature">
        <span class="glyphicon glyphicon-star feature-icon" aria-hidden="true"></span>
        <h3>同城伴友</h3>
        <p>
          找到同月预产期的伙伴，<br>
          一起打卡、互相鼓励。
        </p>
      </div>

    </div>
  </div>

  <!-- 底部 -->
  <div class="footer text-center">
    <p>好孕妈妈交流群 &copy; 2026 &nbsp;·&nbsp; 与你一起迎接新生命 ✨</p>
    <p style="color:#ccc; font-size:12px;">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow" style="color:#ccc;">鲁ICP备2025144109号-21</a>
      &nbsp;&nbsp;
      <span style="color:#ccc;">鲁公网安备37130202372537号</span>
    </p>
  </div>

  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.3.4/js/bootstrap.min.js"></script>
</body>
</html>
